name: Feature request
description: A new check, report or picture you would use
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to find out about a model file, and why can't you today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: The command or output you have in mind. Rough is fine.
  - type: textarea
    id: example
    attributes:
      label: An example file
      description: A model where this matters (Hugging Face repo and file name), if there is one.
